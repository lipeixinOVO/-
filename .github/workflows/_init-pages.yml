name: init-pages

# 一次性任务：用 Actions 自带的 GITHUB_TOKEN 创建 Pages 站点（源 main /docs）。
# 个人 token 没有 Pages 写权限，但工作流里的 GITHUB_TOKEN 可以声明 pages: write。
# 成功启用后本文件可删除。
on:
  push:
    paths:
      - ".github/workflows/_init-pages.yml"
  workflow_dispatch:

permissions:
  pages: write
  contents: read

jobs:
  init:
    runs-on: ubuntu-latest
    steps:
      - name: 创建 Pages（main /docs）
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "== 先查是否已存在 =="
          curl -s -o /tmp/get.json -w "GET %{http_code}\n" \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages"
          cat /tmp/get.json || true
          echo "== 创建 =="
          curl -s -o /tmp/post.json -w "POST %{http_code}\n" \
            -X POST \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -d '{"source":{"branch":"main","path":"/docs"}}' \
            "https://api.github.com/repos/${{ github.repository }}/pages"
          cat /tmp/post.json || true
