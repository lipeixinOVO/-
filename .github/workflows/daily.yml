name: daily-dca

# 每个交易日 6 次（UTC 标注，北京时间 = UTC+8）。
#
# 分钟数故意用 07 / 17 / 37 / 47，避开 :00 和 :30：
# GitHub 的 schedule 是「尽力而为」，官方文档明说高负载时会 delay 甚至 drop，
# 整点/半点是全网仓库最挤的时刻。2026-10-24（周六）08:30 那次就是这么丢的 ——
# 工作流 state 仍是 active、没有任何失败记录，就是压根没触发。错开几分钟能躲开高峰。
#
# 为什么不是更密（比如每 5 分钟一次）：
#   · 一次跑批要拉美债 5956 天 CSV + MSCI 官方接口 + 中证官网 + 新浪 + 蛋卷，实测 2~3 分钟；
#   · 分数用的全是日频数据（PE、股息率、国债利率一天只出一次），日内只有价格在动，
#     5 分钟一跑不会让分数更准，只会把接口拉到限流；
#   · cron 最小粒度就是 5 分钟，且不保证准时，当不了实时用。
# 想在盘中最快看到分数变化，正确做法是把 6 次挤进交易时段，而不是把间隔压到最短。
#
# 注：美股时段是北京 21:30–04:00。最早一次是 08:07，
#     抓到的一直是「最近一个已收盘」的美股数据，不会把盘中价写进历史。
on:
  schedule:
    - cron: "7 0 * * 1-6"     # 北京 08:07  主批次：美股已收盘、隔夜数据齐，A 股未开盘
    - cron: "7 2 * * 1-5"     # 北京 10:07  A 股早盘
    - cron: "17 3 * * 1-5"    # 北京 11:17  上午尾盘
    - cron: "37 5 * * 1-5"    # 北京 13:37  A 股午后
    - cron: "47 6 * * 1-5"    # 北京 14:47  尾盘
    - cron: "17 7 * * 1-5"    # 北京 15:17  A 股收盘后（当日最终值）
  workflow_dispatch:          # 手动触发

permissions:
  contents: write            # 需要回写 data/out 与 docs

concurrency:
  group: daily-dca
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 纯标准库实现，无第三方依赖，不需要 pip install
      - name: 数据源连通性探针（调试期用，仅打印不阻断）
        run: python tools/probe_ci.py

      - name: 跑批（抓数 → 算分 → 出快照）
        run: python run_daily.py

      - name: 生成站点
        run: python build_site.py

      # 站点生成后先自检：数据缺项、权重和不等于 100、曲线与当天不一致都会让这一步失败，
      # 失败即不提交，避免把坏数据推到线上页面。
      - name: 交付前自检
        run: python tools/selfcheck.py

      - name: 提交结果
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "无变化，跳过提交"
          else
            git commit -m "chore: 每日跑批 $(TZ=Asia/Shanghai date +%Y-%m-%d)"
            git push
          fi

# Pages 走「Deploy from a branch → main /docs」：
# 上面的 git push 只要改到 docs/，GitHub 就会自动重新发布，不需要额外部署 workflow。
