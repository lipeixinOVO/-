name: daily-dca

# 每天跑 4 次（UTC 标注，换算成北京时间见行尾注释）。
# 08:30 那次是主批次：美股已收盘、隔夜数据齐，A 股未开盘，当天的倍数可以照着执行。
# 另外三次只在 A 股交易时段，用来把 A 股盘中价格与分数刷新到最近 1~2 小时。
# 注：美股交易时段是北京 21:30–04:00，这三次都落在 04:00 之后，
#     所以抓到的一直是「最近一个已收盘」的美股数据，不会把盘中价写进历史。
on:
  schedule:
    - cron: "30 0 * * 1-6"   # 北京 08:30（周一~周六）主批次：美股已收盘、A 股未开盘
    - cron: "35 2 * * 1-5"   # 北京 10:35（周一~周五）A 股早盘
    - cron: "35 5 * * 1-5"   # 北京 13:35  A 股午后
    - cron: "15 7 * * 1-5"   # 北京 15:15  A 股收盘后（当日最终值）
  workflow_dispatch:         # 手动触发

permissions:
  contents: write            # 需要回写 data/out 与 docs

concurrency:
  group: daily-dca
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 纯标准库实现，无第三方依赖，不需要 pip install
      - name: 数据源连通性探针（调试期用，仅打印不阻断）
        run: python tools/probe_ci.py

      - name: 跑批（抓数 → 算分 → 出快照）
        run: python run_daily.py

      - name: 生成站点
        run: python build_site.py

      # 站点生成后先自检：数据缺项、权重和不等于 100、曲线与当天不一致都会让这一步失败，
      # 失败即不提交，避免把坏数据推到线上页面。
      - name: 交付前自检
        run: python tools/selfcheck.py

      - name: 提交结果
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "无变化，跳过提交"
          else
            git commit -m "chore: 每日跑批 $(TZ=Asia/Shanghai date +%Y-%m-%d)"
            git push
          fi

# Pages 走「Deploy from a branch → main /docs」：
# 上面的 git push 只要改到 docs/，GitHub 就会自动重新发布，不需要额外部署 workflow。
