name: daily-dca

# 每个交易日 13 次（UTC 标注，北京时间 = UTC+8）。
#
# 分钟数全是 07 / 17 / 27 / 37 / 57，故意避开 :00 和 :30：
# GitHub 的 schedule 是「尽力而为」，官方文档明说高负载时会 delay 甚至 drop，
# 整点/半点是全网仓库最挤的时刻。2026-10-24（周六）08:30 那次就是这么丢的 ——
# 工作流 state 仍是 active、没有任何失败记录，就是压根没触发。错开几分钟能躲开高峰。
#
# 排布逻辑（按用途分组，不是为了凑次数）：
#   06:37        美股收盘（北京 04:00）后 2.5 小时，专门抢 MSCI / 美股的隔夜收盘。
#                MSCI 官方 EOD 不一定收盘瞬间就有，这一批取不到也无害（分数不变），08:07 兜底。
#   08:07        主批次：美股已收盘、A 股未开盘，当天的倍数可以照着执行。
#   09:37~11:27  早盘每半小时（11:27 贴上午收盘；11:30-13:00 午休不跑）
#   13:07~14:57  午后每半小时（14:57 贴尾盘）
#   15:17        收盘后最终值，覆盖当天前面所有记录
#
# 为什么不是更密（比如每 5 分钟）：一次跑批实测 2~3 分钟，且分数用的全是日频/周频输入
# （PE、股息率、国债利率一天只出一次），日内只有价格在动。半小时已能跟上盘中分数变化，
# 再密只会把接口拉到限流、把 Pages 重建次数堆上去。
#
# 注：美股时段是北京 21:30–04:00。最早的 06:37 已在其后，
#     抓到的永远是「最近一个已收盘」的美股数据，不会把盘中价写进历史。
on:
  schedule:
    - cron: "37 22 * * 0-5"   # 北京 06:37（周一~周六）美股 / MSCI 隔夜收盘
    - cron: "7 0 * * 1-6"     # 北京 08:07（周一~周六）主批次
    - cron: "37 1 * * 1-5"    # 北京 09:37  A 股开盘后
    - cron: "7 2 * * 1-5"     # 北京 10:07
    - cron: "37 2 * * 1-5"    # 北京 10:37
    - cron: "7 3 * * 1-5"     # 北京 11:07
    - cron: "27 3 * * 1-5"    # 北京 11:27  上午尾盘
    - cron: "7 5 * * 1-5"     # 北京 13:07  午后开盘
    - cron: "37 5 * * 1-5"    # 北京 13:37
    - cron: "7 6 * * 1-5"     # 北京 14:07
    - cron: "37 6 * * 1-5"    # 北京 14:37
    - cron: "57 6 * * 1-5"    # 北京 14:57  尾盘
    - cron: "17 7 * * 1-5"    # 北京 15:17  收盘后最终值
  workflow_dispatch:          # 手动触发

permissions:
  contents: write            # 需要回写 data/out 与 docs

concurrency:
  group: daily-dca
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 纯标准库实现，无第三方依赖，不需要 pip install
      - name: 数据源连通性探针（调试期用，仅打印不阻断）
        run: python tools/probe_ci.py

      - name: 跑批（抓数 → 算分 → 出快照）
        run: python run_daily.py

      - name: 生成站点
        run: python build_site.py

      # 站点生成后先自检：数据缺项、权重和不等于 100、曲线与当天不一致都会让这一步失败，
      # 失败即不提交，避免把坏数据推到线上页面。
      - name: 交付前自检
        run: python tools/selfcheck.py

      - name: 提交结果
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "无变化，跳过提交"
          else
            git commit -m "chore: 每日跑批 $(TZ=Asia/Shanghai date +%Y-%m-%d)"
            git push
          fi

# Pages 走「Deploy from a branch → main /docs」：
# 上面的 git push 只要改到 docs/，GitHub 就会自动重新发布，不需要额外部署 workflow。
